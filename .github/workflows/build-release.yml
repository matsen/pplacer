name: Build Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-linux:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            name: linux-x86_64
          - platform: linux/arm64
            name: linux-arm64
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Build using unified build script
      run: |
        chmod +x scripts/build-docker.sh
        PLATFORM=${{ matrix.platform }} OCAML_VERSION=5.2.1 PPLACER_VERSION="${{ github.event.release.tag_name }}" ./scripts/build-docker.sh --test
        
    - name: Verify output exists
      run: |
        ls -la pplacer-${{ matrix.name }}.zip
        
    - name: Upload binaries
      uses: actions/upload-artifact@v4
      with:
        name: pplacer-${{ matrix.name }}
        path: pplacer-${{ matrix.name }}.zip
        
    - name: Upload to release
      if: github.event_name == 'release'
      run: |
        gh release upload ${{ github.event.release.tag_name }} pplacer-${{ matrix.name }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Build using unified build script
      run: |
        chmod +x scripts/build-macos.sh
        ./scripts/build-macos.sh --deps
        OCAML_VERSION=5.2.1 PPLACER_VERSION="${{ github.event.release.tag_name }}" ./scripts/build-macos.sh
        
    - name: Rename macOS output for consistency
      run: |
        if [ -f pplacer-macos-arm64.zip ]; then
          echo "File already correctly named"
        elif [ -f pplacer-macos-intel.zip ]; then
          mv pplacer-macos-intel.zip pplacer-macos-arm64.zip
        else
          echo "Looking for macOS output files:"
          ls -la pplacer-macos-*.zip
        fi
      
    - name: Upload binaries
      uses: actions/upload-artifact@v4
      with:
        name: pplacer-macos-arm64
        path: pplacer-macos-arm64.zip
        
    - name: Upload to release
      if: github.event_name == 'release'
      run: |
        gh release upload ${{ github.event.release.tag_name }} pplacer-macos-arm64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

